<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Beneficiario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/estilos.css') }}">
</head>
<body>

    <div class="container container-form">
        <h2>Registrar Nuevo Beneficiario</h2>

        {% if error %}
        <div class="alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('nuevo_beneficiario', id_cuenta=id_cuenta) }}" method="POST">
            <div class="form-group">
                <label for="id_tipo_documento">Tipo de Documento:</label>
                <select id="id_tipo_documento" name="id_tipo_documento" required>
                    <option value="">Seleccione un tipo...</option>
                    {% for td in tipos_documento %}
                    <option value="{{ td.IdTipoDocuIdentidad or td.IdTipoDocumento }}">{{ td.Nombre or td.Descripcion }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="documento">Número de Documento:</label>
                <input type="text" id="documento" name="documento" required>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="telefono1">Teléfono Principal:</label>
                <input type="tel" id="telefono1" name="telefono1" required>
            </div>

            <div class="form-group">
                <label for="telefono2">Teléfono Secundario:</label>
                <input type="tel" id="telefono2" name="telefono2">
            </div>

            <div class="form-group">
                <label for="id_parentezco">Parentesco:</label>
                <select id="id_parentezco" name="id_parentezco" required>
                    <option value="">Seleccione un parentesco...</option>
                    {% for p in parentescos %}
                    <option value="{{ p.Id }}">{{ p.Nombre or p.Descripcion }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="porcentaje">Porcentaje (%):</label>
                <input type="number" id="porcentaje" name="porcentaje" min="0" max="100" step="1" required>
            </div>

            <div class="acciones">
                <button type="submit" class="btn btn-primary">Guardar Beneficiario</button>
                <a href="{{ url_for('beneficiarios', id_cuenta=id_cuenta) }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

</body>
</html>
