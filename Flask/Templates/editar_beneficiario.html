<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Beneficiario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/estilos.css') }}">
</head>
<body>

    <div class="container container-form">
        <h2>Editar Beneficiario</h2>

        {% if error %}
        <div class="alert-error">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ url_for('editar_beneficiario', id_cuenta=id_cuenta, id_beneficiario=beneficiario.IdBeneficiario) }}" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" value="{{ beneficiario.Nombre }}" required>
            </div>

            <div class="form-group">
                <label for="documento">Número de Documento:</label>
                <input type="text" id="documento" name="documento" value="{{ beneficiario.ValorDocumentoIdentidad or beneficiario.Documento }}" required>
            </div>

            <div class="form-group">
                <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" value="{{ beneficiario.FechaNacimiento }}" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" value="{{ beneficiario.Email }}" required>
            </div>

            <div class="form-group">
                <label for="telefono1">Teléfono Principal:</label>
                <input type="tel" id="telefono1" name="telefono1" value="{{ beneficiario.Telefono1 }}" required>
            </div>

            <div class="form-group">
                <label for="telefono2">Teléfono Secundario:</label>
                <input type="tel" id="telefono2" name="telefono2" value="{{ beneficiario.Telefono2 or '' }}">
            </div>

            <div class="form-group">
                <label for="id_parentezco">Parentesco:</label>
                <select id="id_parentezco" name="id_parentezco" required>
                    {% for p in parentescos %}
                    <option value="{{ p.Id }}" {% if p.Id == beneficiario.IdParentezco %}selected{% endif %}>
                        {{ p.Nombre or p.Descripcion }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="porcentaje">Porcentaje (%):</label>
                <input type="number" id="porcentaje" name="porcentaje" value="{{ beneficiario.Porcentaje }}" min="0" max="100" step="1" required>
            </div>

            <div class="acciones">
                <button type="submit" class="btn btn-primary">Actualizar Cambios</button>
                <a href="{{ url_for('beneficiarios', id_cuenta=id_cuenta) }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

</body>
</html>
